version: 1
index_path: .agent-context/context-index.json
schema_path: schemas
governed_paths:
  - .
exclude_paths:
  # Generated presentation only; README.md remains the governed source.
  - .github/README.md
  - .git
  - node_modules
  - dist
  - coverage
require_frontmatter_for_all_markdown: true
require_topic_id_for_canonical: true
allow_missing_references:
  - SaveManager.cs
  - SaveSystemTests.cs
  - docs/save-system/README.md
