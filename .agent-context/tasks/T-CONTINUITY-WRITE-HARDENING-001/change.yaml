acceptance_cases:
  - {id: AC-GIT, given: Git exits zero but warns that part of the worktree was unreadable., expected: Handoff and checkpoint creation reject without writing output., failure_or_uncertainty: No automatic global Git configuration or guessed completeness., counterexample: A truncated status inventory is reported complete., oracle: Injected warning and real long-path Git fixtures with before-after hashes., status: pass, evidence_refs: [.agent-context/tasks/T-CONTINUITY-WRITE-HARDENING-001/evidence/verification.md, test/continuity-write-hardening.test.ts]}
  - {id: AC-BYTES, given: Existing output bytes decode to the same text but differ or inventory JSON is ambiguous., expected: Writers reject raw collisions and readers reject invalid encoding or noncanonical sidecars., failure_or_uncertainty: Legacy valid YAML and JSON are not silently normalized or rewritten., counterexample: Corrupt archive accepted by creation validation and resume., oracle: Raw malformed-UTF8 and BOM/duplicate-key fixtures plus exact-valid-byte controls., status: pass, evidence_refs: [.agent-context/tasks/T-CONTINUITY-WRITE-HARDENING-001/evidence/verification.md, test/continuity-write-hardening.test.ts]}
  - {id: AC-PATHS, given: Any archive packet active output or latest handoff path is linked aliased or has a known incompatible output., expected: Every destination is checked before writes and rechecked when used., failure_or_uncertainty: Stable exclusive tree required; no guarantee against hostile races or crash-atomic multi-file commit., counterexample: A deep junction redirects writes or a deterministic late collision leaves new files., oracle: Link alias and late-collision preservation tests in disposable roots., status: pass, evidence_refs: [.agent-context/tasks/T-CONTINUITY-WRITE-HARDENING-001/evidence/verification.md, test/continuity-write-hardening.test.ts]}
  - {id: AC-HISTORY, given: A retained middle handoff is not referenced by a resume packet., expected: Its own hash owner source archive and optional inventory are audited while old source freshness is not required., failure_or_uncertainty: Historical integrity is not current-use permission., counterexample: Removing its inventory passes repository validation or later source drift invalidates genuine history., oracle: Three-generation handoff fixture and retained-source drift controls., status: pass, evidence_refs: [.agent-context/tasks/T-CONTINUITY-WRITE-HARDENING-001/evidence/verification.md, test/continuity-write-hardening.test.ts]}
  - {id: AC-ENTRY, given: New handoff creation or a human-readable diagnostic encounters invalid current inputs., expected: Selected-source drift and missing resume sources fail before writes; detail and deterministic ordering are retained., failure_or_uncertainty: Generic evidence prose is not automatically a filesystem reference., counterexample: Immediately unusable handoff succeeds or repair details disappear outside JSON., oracle: Source-drift missing-input and CLI output assertions., status: pass, evidence_refs: [.agent-context/tasks/T-CONTINUITY-WRITE-HARDENING-001/evidence/verification.md, test/continuity-write-hardening.test.ts]}
