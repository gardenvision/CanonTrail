decision_rationale: The maintainer authorized remaining review corrections. Exact-byte archival and complete status disclosure must hold across older writers and every reader, not just the new inventory path. Known collisions must be detected before any output. Separate historical integrity from current use and retain explicit stable-tree and unsigned-provenance limits.
