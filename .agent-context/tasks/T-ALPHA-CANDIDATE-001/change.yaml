acceptance_cases:
  - id: AC-CURATION
    given: A private development tree contains useful implementation and private project evidence.
    expected: The candidate includes a reviewed allowlist and no unreviewed private evidence.
    failure_or_uncertainty: References or distribution files may depend on excluded history.
    counterexample: Excluding a file silently breaks a shipped test or documentation route.
    oracle: Candidate file inventory, privacy inspection, link checks and complete test suite.
    status: pass
    evidence_refs: [.agent-context/tasks/T-ALPHA-CANDIDATE-001/evidence/verification.json]
  - id: AC-ONBOARDING
    given: A new user has the candidate source and a small existing project.
    expected: Build and safe adoption are reproducible with explicit source/target paths and bounded context.
    failure_or_uncertainty: Init conflicts can still produce partial additions after explicit apply.
    counterexample: A failed dry-run is followed automatically by an unreviewed adoption.
    oracle: Synthetic CLI receipts and preserved source hashes.
    status: pass
    evidence_refs: [.agent-context/tasks/T-ALPHA-CANDIDATE-001/evidence/verification.json]
  - id: AC-QUALITY
    given: Candidate docs and development dependencies have changed.
    expected: Current quality results and remaining approval gates are reported separately.
    failure_or_uncertainty: A green structural check does not constitute independent review or license approval.
    counterexample: Pending release review is marked passed using only author tests.
    oracle: Tests, dependency audit, structural validation and task-scoped gate receipts.
    status: pass
    evidence_refs: [.agent-context/tasks/T-ALPHA-CANDIDATE-001/evidence/verification.json]
