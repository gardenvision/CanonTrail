decision_rationale: Preserve the independently reviewed predecessor and apply only bounded report-ordering caller-text and documentation corrections from its conditional review. The owner accepted retained project-name references after superseding an initial rejection; do not rewrite history or immutable archives. The owner explicitly retained the stricter mjs policy and requested clear compatibility documentation. A new head needs exact CI and independent delta review; predecessor evidence is not new approval.
documentation_structure:
