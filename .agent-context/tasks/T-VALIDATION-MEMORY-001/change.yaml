  - {id: AC-COMPAT, given: Existing positive negative and current-use fixtures., expected: Counts diagnostics and retained/current distinctions are unchanged., failure_or_uncertainty: Findings describe recorded integrity not approval or producer authenticity., counterexample: Deferred files vanish from stats or targeted resume participates incorrectly., oracle: Full regression suite and normalized predecessor report comparison., status: pass, evidence_refs: [.agent-context/tasks/T-VALIDATION-MEMORY-001/evidence/verification.md]}
