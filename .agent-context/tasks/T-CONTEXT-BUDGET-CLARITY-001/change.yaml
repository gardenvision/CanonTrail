title: Explain required-source costs and task completion scope
status: verified
risk: medium
author: CanonTrail implementation agent
canonical_source: ARTIFACT_PROTOCOL.md
decision_rationale: The maintainer requested more useful context-budget guidance and clearer parallel-task finalization after a practical Unity task. Reuse the existing explicit section contract and preserve all selection and completion gates.
documentation_structure:
  decision: no-feature-document-change
  rationale: The context and finalization behavior belongs to the existing protocol and usage guide; no new user-facing feature boundary is introduced.
  feature_documents: []
acceptance_cases:
  - id: AC-COSTS
    given: A task requires several whole sources with different sizes and also has optional candidates.
    expected: Successful text and JSON reports expose every required source cost and a stable largest-first human summary; over-budget errors identify the same largest drivers.
    failure_or_uncertainty: Estimates are byte-based and do not claim actual model usage; failure preserves the previous lock.
    counterexample: An optional large file appears in the required ranking or a required file disappears from the breakdown.
    oracle: Compare source identities and estimates with the candidate list and assert unchanged compiled lock bytes in a deterministic fixture.
    status: pass
    evidence_refs: [test/context.test.ts, .agent-context/tasks/T-CONTEXT-BUDGET-CLARITY-001/evidence/verification.txt]
  - id: AC-SECTIONS
    given: A task owner reviews a required whole source and decides that one exact range suffices.
    expected: Removing only that task-owned whole requirement and adding its current hash-bound context_sections entry yields a smaller required view; full-file drift or a retained whole requirement is rejected.
    failure_or_uncertainty: Intrinsically required canonical, governing, external, or cited evidence sources remain whole; semantic sufficiency is the task owner's decision.
    counterexample: The compiler silently narrows a strong canonical route or accepts a stale full-file hash for the section.
    oracle: Existing section contract and a new whole-to-section fixture compare selected bytes, rejection cases and lock hashes.
    status: pass
    evidence_refs: [test/context-sections.test.ts, .agent-context/tasks/T-CONTEXT-BUDGET-CLARITY-001/evidence/verification.txt]
  - id: AC-SCOPE
    given: The named task meets completion gates but an unrelated active peer has selected-source drift.
    expected: Human output states that task completion passes and repository health fails; JSON and repository-only finalization preserve existing strictness and diagnostics.
    failure_or_uncertainty: Unresolved task dependencies or integrity faults still block the named task.
    counterexample: The report says the project is healthy or defers a relevant peer's drift.
    oracle: Compare task-scoped and repository-only reports in the existing parallel-context fixture.
    status: pass
    evidence_refs: [test/task-scoped-finalize.test.ts, .agent-context/tasks/T-CONTEXT-BUDGET-CLARITY-001/evidence/verification.txt]
