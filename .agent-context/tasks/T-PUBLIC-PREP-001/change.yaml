acceptance_cases:
  - id: AC-NEUTRAL
    given: A supported legacy header is scanned with auto, the preferred explicit adapter or its deprecated alias.
    expected: New plans use legacy-header-v1 for the detected format and count key; explicit aliases normalize to the preferred adapter and normal help has no historical project name.
    failure_or_uncertainty: Unknown adapters fail and a neutral name does not imply universal Markdown migration.
    counterexample: The deprecated name remains in normal JSON output or alias normalization drops detection.
    oracle: Exact output assertions for the same synthetic source and timestamp, plus CLI help and invalid-input cases.
    status: pass
    evidence_refs: [.agent-context/tasks/T-PUBLIC-PREP-001/evidence/verification.json]
  - id: AC-COMPAT
    given: An existing version-1 plan uses the historical format and count names.
    expected: It remains readable and hash-valid without rewriting; new neutral plans also validate. Mixed count/document vocabularies, duplicate aliases and incorrect counts fail.
    failure_or_uncertainty: Older installed schemas need explicit synchronization before consuming the additive vocabulary; no automatic configuration rewrite.
    counterexample: Rehashing a contradictory mixed-vocabulary plan makes it validate.
    oracle: Preserved historical fixture, exact self-hash comparison and independently assembled negative payloads through schema and repository validation.
    status: pass
    evidence_refs: [.agent-context/tasks/T-PUBLIC-PREP-001/evidence/verification.json]
  - id: AC-BOUNDARIES
    given: The baseline has reviewed migration safety and immutable historical locks and teaching examples.
    expected: No execution or recovery algorithm changes, historical bytes remain intact and migration and full regressions pass.
    failure_or_uncertainty: No new hosted platform evidence or real-project execution is claimed.
    counterexample: Renaming changes restored document bytes or silently refreshes completed locks.
    oracle: Full test suite, targeted neutral and alias roundtrip comparison and manifest preservation.
    status: pass
    evidence_refs: [.agent-context/tasks/T-PUBLIC-PREP-001/evidence/verification.json]
  - id: AC-DISTRIBUTION
    given: A private source candidate has linked documentation missing from the package and unconfigured release routes.
    expected: Documentation and third-party inventory are included in a dry-run package; no operational history is packaged, private remains true and unresolved hosting decisions are explicit.
    failure_or_uncertainty: Metadata and an author audit are not legal clearance, independent review or publication.
    counterexample: A nonexistent public endpoint or private reporting address is presented as configured.
    oracle: Parsed pack inventory, retained license files, explicit release checklist and exact source audit.
    status: pass
    evidence_refs: [.agent-context/tasks/T-PUBLIC-PREP-001/evidence/verification.json]
