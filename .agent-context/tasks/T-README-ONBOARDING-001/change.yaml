title: Clear visual introduction and easier agent onboarding
status: verified
risk: medium
author: CanonTrail documentation implementation agent
canonical_source: .agent-context/tasks/T-README-ONBOARDING-001/brief.md
decision_rationale: The maintainer requested a clearer GitHub introduction and copyable entry prompt. Reorganize presentation without changing product authority, safety contracts or runtime behavior.
documentation_structure:
  decision: no-feature-document-change
  rationale: No new product capability; separate concise landing material from existing command-reference detail in a linked usage guide, preserving one owner per section.
  feature_documents: []
acceptance_cases:
  - id: AC-ENTRY
    given: A reader has not used CanonTrail before.
    expected: A short introduction, visible Alpha boundary and source-build steps establish what to do first.
    failure_or_uncertainty: No npm package, automatic knowledge generation or measured savings is promised.
    counterexample: A catchy description implies the tool runs agents or prevents compaction.
    oracle: Compare wording to VISION and the published source commands; exercise commands in an isolated fixture.
    status: pass
    evidence_refs: [.agent-context/tasks/T-README-ONBOARDING-001/evidence/local-checks.json]
  - id: AC-VISUAL
    given: The GitHub page is read at desktop or mobile width.
    expected: The diagram explains selection and continuity with readable labels and a text alternative.
    failure_or_uncertainty: Image blocking leaves explanatory text; no external rendering service is necessary.
    counterexample: The diagram silently implies full-project ingestion or automatic verified documentation.
    oracle: Inspect rendered desktop/mobile output and compare labels with the product ownership boundary.
    status: pass
    evidence_refs: [.agent-context/tasks/T-README-ONBOARDING-001/evidence/local-checks.json, .agent-context/tasks/T-README-ONBOARDING-001/evidence/hosted-checks.json]
  - id: AC-PROMPT
    given: An agent receives the prompt for a new, already adopted, or resumed target.
    expected: It verifies tool/target paths, chooses the correct route, preserves existing rules and establishes bounded context before work.
    failure_or_uncertainty: Missing access, conflicting files or incomplete scope stop with an actionable report.
    counterexample: The same init is applied blindly on every new session, or a handoff alone authorizes implementation.
    oracle: Walk every prompt branch against actual help and protocol sections 5, 7 and 8.
    status: pass
    evidence_refs: [.agent-context/tasks/T-README-ONBOARDING-001/evidence/local-checks.json]
  - id: AC-PRESERVE
    given: A published Alpha and existing operational guidance already exist.
    expected: Detailed caveats remain linked and runtime, schemas, examples, historical tasks and release identities remain untouched.
    failure_or_uncertainty: Hosted CI is only claimed after the new revision actually runs.
    counterexample: Old locks are recompiled merely because README changed, or the existing release tag is moved.
    oracle: Git diff allowlist, Markdown link checks, baseline hashes and fresh repository/task checks.
    status: pass
    evidence_refs: [.agent-context/tasks/T-README-ONBOARDING-001/evidence/hosted-checks.json]
