decision_rationale: The user requested improving measured field friction and authorized a goal plus clean public commit push merge. Preserve authoritative shared truth and global safety; allow only explicitly scoped current task work to proceed around a narrow positively identified peer-note defect. Independent r2 counterexamples require positive excluded-owner identity, portable reference proof, retained-peer ownership closure and unknown-marker rejection; current-use additionally requires explicit installed mode capability, unlike historical integrity-only reading. A separate r4 decision retains static active-lock integrity in the working preflight while skipping only current source/index freshness; unknown markers, self-hash corruption, budget overflow, duplicate sources and omitted requirements cannot be hidden by orientation mode. Independent r4b counterexamples require filesystem-free source-path grammar validation before an active-lock freshness skip, using the compiler's existing exact repository-relative grammar. Historical terminal receipts retain their existing path/freshness boundary; no historical payload is rewritten.
