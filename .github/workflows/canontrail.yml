name: CanonTrail

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  completion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run check
      - name: Build distributable CLI
        run: npm run build
      - name: Test
        run: npm test -- --maxWorkers=1
      - name: Enforce CanonTrail documentation health
        run: node dist/cli.js finalize . --fail-on-warnings
